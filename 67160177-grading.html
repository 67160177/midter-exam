<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Grade Calculator</title>

  <style>

/* ===== Page ===== */
body {
  background-color: #333333;
  font-family: "Segoe UI", Tahoma, sans-serif;
}

/* ===== Container ===== */
.container {
  max-width: 600px;
  margin: 40px auto;
  padding: 30px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
}

/* ===== Title ===== */
h2 {
  text-align: center;
  margin-bottom: 25px;
  color: #333;
}

/* ===== Form Row ===== */
.form-row {
  display: flex;
  align-items: center;
  margin-bottom: 15px;
}

.form-row label {
  width: 160px;
  font-weight: 600;
  color: #444;
}

.form-row input {
  flex: 1;
  padding: 10px 12px;
  border-radius: 6px;
  border: 1.5px solid #ccc;
  font-size: 15px;
  transition: 0.2s;
}

.form-row input:focus {
  outline: none;
  border-color: #007bff;
  background-color: #f9fcff;
}

/* ===== Buttons ===== */
.button-group {
  display: flex;
  justify-content: space-between;
  margin-top: 25px;
}

button {
  width: 48%;
  padding: 12px;
  font-size: 16px;
  font-weight: 600;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  transition: 0.2s;
}

#btn-calculate {
  background-color: #007bff;
  color: white;
}

#btn-calculate:hover {
  background-color: #0056b3;
}

#btn-clear {
  background-color: #e0e0e0;
  color: #333;
}

#btn-clear:hover {
  background-color: #cfcfcf;
}

/* ===== Result Box ===== */
#result-container {
  margin-top: 25px;
  padding: 18px;
  background-color: #f1f8ff;
  border-left: 5px solid #007bff;
  border-radius: 8px;
}

#result-container p {
  margin: 8px 0;
  font-size: 16px;
}

#final-grade {
  font-weight: bold;
  font-size: 18px;
  color: #007bff;
}

#pass-status {
  font-weight: bold;
}

.result-item {
  background: #ffffff;
  padding: 12px;
  margin-bottom: 10px;
  border-left: 4px solid #007bff;
  border-radius: 6px;
  font-size: 15px;
}

  </style>
</head>

<body>

<div class="container">
  <h2>Grade Calculator</h2>

  <div class="form-row">
    <label>Student Name</label>
    <input id="student-name" type="text">
  </div>

  <div class="form-row">
    <label>Subject</label>
    <input id="subject-name" type="text">
  </div>

  <div class="form-row">
    <label>Midterm (0-100)</label>
    <input id="midterm-score" type="int">
  </div>

  <div class="form-row">
    <label>Final (0-100)</label>
    <input id="final-score" type="int">
  </div>

  <div class="form-row">
    <label>Assignment (0-100)</label>
    <input id="assignment-score" type="int">
  </div>

  <div class="button-group">
    <button id="btn-calculate">Calculate Grade</button>
    <button id="btn-clear">Clear</button>
  </div>

  <div id="result-container" style="display: none;">
  <h3>Result History</h3>
  <div id="result-list"></div>
</div>

</div>

<script>

    
</script>


</body>
</html>
